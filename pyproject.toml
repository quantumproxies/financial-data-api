[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-financial-data-api"
version = "0.1.0"
description = "Financial data API for Python and the command line: stock quotes, crypto prices, DeFi TVL, ECB exchange rates, LEI records and SEC EDGAR filings in one client, with one sign-in and the same JSON or CSV rows for every source. Free and open source; runs on your QuanticData account."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["financial-data-api", "financial-data", "finance-api", "stock-api", "stock-market-api", "stock-market-data", "market-data", "crypto-api", "cryptocurrency", "defi", "exchange-rates", "forex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
financial-data = "quanticdata_financial_data_api.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/marketwatch-api/?utm_source=github&utm_medium=pypi&utm_campaign=financial-data-api"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/financial-data-api"
Issues = "https://github.com/quantumproxies/financial-data-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_financial_data_api" = ["spec.json", "py.typed"]
